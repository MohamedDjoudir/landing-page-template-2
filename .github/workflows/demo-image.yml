# Builds the hosted demo's image and stores it, private, on ghcr.io. The demo host
# never builds: a demo-* tag on the commit to deploy starts this workflow, and the
# host pulls the result. The image is the buyer's own Dockerfile with the demo's
# public address filled in. This folder is left out of the buyer download.
name: Demo image

on:
  push:
    tags: ['demo-*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/mohameddjoudir
  IMAGE: demo-landing-page-2
  # Inlined into the browser bundle at build time, so public by definition.
  NEXT_PUBLIC_SITE_URL: "https://landing-page-template-2.aniq-ui.com"
  # The build record would count against the account's artifact storage.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  image:
    name: demo-landing-page-2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Name the build
        id: build
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.build.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.build.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
